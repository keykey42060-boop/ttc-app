name: Build Android APK

on:
  push:
    branches:
      - codex/pwa-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install app dependencies
        run: npm ci

      - name: Install Capacitor Android tooling
        run: npm install --no-save --no-package-lock @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8

      - name: Build web app
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Copy app into Android project
        run: npx cap sync android

      - name: Assemble installable debug APK
        run: ./gradlew assembleDebug
        working-directory: android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClearRide-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
