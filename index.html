<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#991b1b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ClearRide" />
    <meta name="description" content="Accessible, high-legibility bus tracker with simple landmark maps, directional arrow, voice announcements, big text mode, and notification prototypes." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/clearride-192.svg" />
    <title>ClearRide - Senior Bus Tracker</title>
    <meta property="og:title" content="ClearRide - Senior Bus Tracker" />
    <meta property="og:description" content="Accessible, high-legibility bus tracker with simple landmark maps, directional arrow, voice announcements, big text mode, and notification prototypes." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="https://use.typekit.net/uce6vuv.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Lexend:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  </head>
  <body>
    <div id="root">
      <main id="startup-message" style="font: 16px system-ui, sans-serif; padding: 24px; color: #111827">
        Starting ClearRide…
      </main>
    </div>
    <script>
      const showStartupError = (message) => {
        const root = document.getElementById('root');
        if (!root) return;
        const notice = document.createElement('main');
        notice.setAttribute('role', 'alert');
        notice.style.cssText = 'font: 16px system-ui, sans-serif; padding: 24px; color: #991b1b';
        notice.textContent = 'ClearRide could not start: ' + message;
        root.replaceChildren(notice);
      };
      window.addEventListener('error', (event) => {
        if (document.getElementById('startup-message')) {
          showStartupError(event.message || 'The app script failed to load.');
        }
      });
      window.addEventListener('unhandledrejection', (event) => {
        if (document.getElementById('startup-message')) {
          const reason = event.reason;
          showStartupError(reason instanceof Error ? reason.message : String(reason));
        }
      });
      window.setTimeout(() => {
        if (document.getElementById('startup-message')) {
          showStartupError('The app did not start. Check the latest deployment and refresh.');
        }
      }, 7000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
